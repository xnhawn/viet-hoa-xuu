name: Build VietHoaXUU DYLIB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/ios-sdks
          cp -R /tmp/ios-sdks/*.sdk $HOME/theos/sdks/

      - name: Build DYLIB
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Collect DYLIB
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Upload DYLIB
        uses: actions/upload-artifact@v4
        with:
          name: VietHoaXUU-DYLIB
          path: output/*.dylib
          if-no-files-found: error
